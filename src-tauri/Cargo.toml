[package]
name = "synapse-kb"
version = "0.1.0"
edition = "2021"
default-run = "synapse-app"

[lib]
name = "synapse_kb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["wry"], optional = true }
# 两个插件只被 `run()`（tauri feature 门控）使用：optional 化后
# --no-default-features（CLI / MCP bin 的 tauri-free 构建，批次 3/5）
# 不再连带编译 tauri→glib（ubuntu CI 无 glib 系统包时曾因此失败）。
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-store = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
notify-debouncer-mini = "0.4"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
regex = "1"

[features]
default = ["tauri"]
tauri = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-store"]

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[[bin]]
name = "synapse"
path = "src/bin/synapse.rs"

[[bin]]
name = "synapse-mcp"
path = "src/bin/synapse_mcp.rs"

[[bin]]
name = "synapse-app"
path = "src/main.rs"
